services:
  postgres:
    image: postgres:16
    container_name: jobtracker-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker123
      POSTGRES_DB: jobtracker_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
